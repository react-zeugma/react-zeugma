name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint --workspace=react-zeugma
      - run: npm run typecheck --workspace=react-zeugma
      - run: npm run build --workspace=react-zeugma
      - run: npm run build --workspace=homepage
